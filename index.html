<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Portal de Vagas </title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>

    <div class="header-container">
        <img src="teste.jpeg" alt="logo Empresa" class="logo-portal"> <!-- nova logo -->
        <h1> Portal de Vagas </h1>
    </div>
    <div class="toolbar">
        <input type="text" id="inputSearch" placeholder="Pesquisar por cargo ou referência" onkeyup="filtrarVagas()">
        <select id="selectArea" onchange="filtrarVagas()" style="appearance: none;">
            <option value="">Todas as Áreas</option>
            <option value="Telemarketing">Telemarketing</option>
            <option value="RH (Departamento Pessoal)">RH (Departamento Pessoal)</option>
            <option value="Administrativo">Administrativo</option>
            <option value="Jurídico">Jurídico</option>
        </select>
        <button id="toggleFavs" class="btn-action" onclick="alternarVisaoFavoritos()">Salvos</button>
    </div>

    <div id="loading" class="loader"></div>
    <div id="lista-vagas"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby6l69xoaZYNNeVIlOXEpRbphvtAOmF7k4oxCc4hUlum-48RdyWc8NlNyJspXS4APsr4g/exec";
        let dbVagas = [];
        let filtroFavoritosAtivo = false;
        let modoVisualizacao = localStorage.getItem('portal_modo_viz') || 'cards';

        function aplicarModoVisualizacao() {
            const container = document.getElementById('lista-vagas');
            const cardsBtn = document.getElementById('viewCardsBtn');
            const listBtn = document.getElementById('viewListBtn');

            container.classList.remove('modo-cards', 'modo-lista');
            container.classList.add('modo-' + modoVisualizacao);

            cardsBtn.classList.toggle('active', modoVisualizacao === 'cards');
            listBtn.classList.toggle('active', modoVisualizacao === 'lista');
        }

        function alternarVisao(modo) {
            modoVisualizacao = modo;
            localStorage.setItem('portal_modo_viz', modo);
            aplicarModoVisualizacao();
            render(dbVagasAtual);
        }

        let dbVagasAtual = [];

        async function init() {
            try {
                console.log('Iniciando fetch...');
                const response = await fetch(API_URL);
                console.log('Status:', response.status);
                console.log('OK:', response.ok);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const text = await response.text();
                console.log('Response text:', text);

                dbVagas = JSON.parse(text);
                console.log('Dados recebidos:', dbVagas);
                document.getElementById('loading').style.display = 'none';
                const favs = obterFavs();
                document.getElementById('toggleFavs').innerText = `Salvos (${favs.length})`;
                modoVisualizacao = 'cards';
                filtrarVagas();
            } catch (err) {
                console.error('Erro detalhado:', err);
                document.getElementById('loading').innerHTML = "Falha na conexão: " + err.message;
            }
        }

        function obterFavs() { return JSON.parse(localStorage.getItem('portal_favs_v2')) || []; }

        function gerenciarFavorito(id) {
            let favs = obterFavs();
            const idStr = String(id);
            favs = favs.includes(idStr) ? favs.filter(f => f !== idStr) : [...favs, idStr];
            localStorage.setItem('portal_favs_v2', JSON.stringify(favs));

            document.getElementById('toggleFavs').innerText = `Salvos (${favs.length})`;
            filtrarVagas();
        }

        function alternarVisaoFavoritos() {
            filtroFavoritosAtivo = !filtroFavoritosAtivo;
            const btn = document.getElementById('toggleFavs');
            const favs = obterFavs();
            btn.classList.toggle('active');
            btn.innerText = filtroFavoritosAtivo ? `Ver Todas` : ` Salvos (${favs.length})`;
            filtrarVagas();
        }

        function filtrarVagas() {
            const termo = document.getElementById('inputSearch').value.toLowerCase().trim();
            const areaFiltro = document.getElementById('selectArea').value;
            const favs = obterFavs();

            let resultado = dbVagas.filter(vaga => {
                const searchScope = Object.values(vaga).join(" ").toLowerCase();
                const matchesText = searchScope.includes(termo);
                const matchesFav = filtroFavoritosAtivo ? favs.includes(String(vaga.id)) : true;
                const matchesArea = areaFiltro === "" ? true : vaga.setor === areaFiltro;
                return matchesText && matchesFav && matchesArea;
            });
            dbVagasAtual = resultado;
            render(resultado);
        }

        function render(vagas) {
            const container = document.getElementById('lista-vagas');
            const favs = obterFavs();
            container.innerHTML = "";
            container.classList.remove('modo-cards', 'modo-lista');
            container.classList.add('modo-cards');

            if (vagas.length === 0) {
                container.innerHTML = `
                    <div style='text-align:center; padding-top:40px; color:#94a3b8'>
                        <div style='font-size: 40px; margin-bottom: 15px;'>🔍</div>
                        <div style='font-size: 16px; margin-bottom: 10px;'>Nenhuma vaga encontrada</div>
                        <div style='font-size: 15px; opacity: 0.7;'>Tente alterar os filtros ou pesquisar por outro termo</div>
                    </div>
                `;
                return;
            }

            vagas.forEach((v, idx) => {
                const isSelected = favs.includes(String(v.id));
                const icones = ['', '', '', '', '', ''];
                const icone = icones[idx % icones.length];

                const watsUrl = `wats.html?titulo=${encodeURIComponent(v.id || '')}`;

                container.innerHTML += `
                    <div class="vaga-card" onclick="gerenciarFavorito('${v.id}')" style="cursor: pointer;">
                        <div style="display: flex; align-items: center; margin-bottom: 12px; gap: 8px;">
                            <span style="font-size: 24px;">${icone}</span>
                            <div class="vaga-ref">ID: ${v.id}</div>
                            <div style="margin-left: auto; font-size: 24px; color: ${isSelected ? '#2563eb' : '#cbd5e1'};">
                                ${isSelected ? '★' : '☆'}
                            </div>
                        </div>
                        <div class="vaga-titulo">${v.titulo || "Título não disponível"}</div>
                        <div style="font-size: 16px; font-weight: 600; color: #60a5fa; margin-bottom: 18px; letter-spacing: 0.5px;">
                            <span style="color: #3b82f6; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-right: 6px;">Setor:</span>${v.setor || "Não definido"}
                        </div>
                        <div style="margin: 15px 0; display: flex; gap: 15px; flex-wrap: wrap;">
                           
                        </div>
                        <div class="vaga-valor"> Remuneração: ${(function (val) {
                        if (val === null || val === undefined || val === '') return 'N/A';
                        if (typeof val === 'number') {
                            return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                        }
                        if (typeof val === 'string') {
                            let str = val.trim();
                            if (str.toUpperCase().includes('R$')) return str;
                            if (/^[\d.,]+$/.test(str)) {
                                let valorNumerico = Number(str.replace(/\./g, '').replace(',', '.'));
                                if (!isNaN(valorNumerico)) {
                                    return valorNumerico.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                                }
                                return 'R$ ' + str;
                            }
                            return str;
                        }
                        return String(val);
                    })(v.empresa)
                    }</div>
                        <span class="status-badge" onclick="event.stopPropagation();" style="cursor: default;">${v.status || 'Processo Aberto'}</span>
                        <div style="margin-top: 15px;">
                            <a href="${watsUrl}" class="link-inscricao" onclick="event.stopPropagation();"> Entrar em contato </a>
                        </div>
                    </div>`;
            });
        }
        window.onload = init;
    </script>


    <footer class="footer">
        <div class="footer-line"></div>
        <h3>Portal de Vagas</h3>
        <p>Dúvidas? Entre em contato via WhatsApp</p>
        <p>© 2026 Murilo Augusto Santos de Mattos</p>
        <p>Todos os direitos reservados</p>
    </footer>
</body>


</html>
