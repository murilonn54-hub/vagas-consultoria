<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> WhatsApp </title>
    <link rel="stylesheet" href="styles.css?v=2">
    <style>
        /* Estilos customizados para página WhatsApp */
        .whatsapp-container {
            width: 100%;
            max-width: 700px;
            animation: containerFade 0.6s ease-out;
        }

        .whatsapp-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px -2px rgba(0, 0, 0, 0.3);
            position: relative;
            color: #e2e8f0;
            border: 2px solid #2563eb;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.5s ease-out;
            overflow: hidden;
            text-align: center;
        }

        .whatsapp-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(37, 99, 235, 0.3);
            border-color: #60a5fa;
        }

        .whatsapp-icon {
            font-size: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 12px rgba(37, 212, 102, 0.25));
            transition: all 0.3s ease;
        }

        .whatsapp-icon:hover {
            filter: drop-shadow(0 6px 16px rgba(37, 212, 102, 0.35));
        }

        .whatsapp-text {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 30px;
            color: #f1f5f9;
            letter-spacing: 0.5px;
        }

        .whatsapp-link {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #25d366 0%, #20ba5f 100%);
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(37, 212, 102, 0.3);
            position: relative;
            overflow: hidden;
        }

        .whatsapp-link::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .whatsapp-link:hover::before {
            width: 300px;
            height: 300px;
        }

        .whatsapp-link:hover {
            background: linear-gradient(135deg, #20ba5f 0%, #1aa852 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 212, 102, 0.4);
        }

        .info-section {
            background: rgba(37, 99, 235, 0.1);
            padding: 24px;
            border-radius: 16px;
            margin: 30px 0 40px 0;
            border-left: 4px solid #2563eb;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 1.1em;
            color: #cbd5e1;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #e0f2fe;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
    </style>
</head>

<body>

    <h1>Contate-nos</h1>

    <div class="whatsapp-container">
        <div class="whatsapp-card">
            <div class="whatsapp-icon">
                <img src="wp-Photoroom.png" alt="wahtsapp" style="width: 100px; height: 100px;">

            </div>
            <div class="whatsapp-text" id="titulo-vaga-display">Candidate-se via WhatsApp</div>
            <p style="font-size: 1.1em; color: #cbd5e1; margin-bottom: 30px; line-height: 1.8;">
                Para se candidatar, por favor compartilhe as seguintes informações:
            </p>

            <div class="info-section">
                <div class="info-item">
                    <span class="info-label"> Nome Completo</span>
                </div>
                <div class="info-item">
                    <span class="info-label"> E-mail</span>
                </div>
                <div class="info-item">
                    <span class="info-label"> Currículo</span>
                </div>
            </div>

            <a id="btn-whatsapp"
                href="https://wa.me/553173312643?text=Olá,%20tenho%20interesse%20em%20uma%20vaga%20divulgada%20no%20portal%20e%20gostaria%20de%20me%20candidatar"
                target="_blank" class="whatsapp-link">
                Enviar via WhatsApp
            </a>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-line"></div>
        <h3>Portal de Vagas</h3>
        <p>Dúvidas? Entre em contato via WhatsApp</p>
        <p>© 2026 Murilo Augusto Santos de Mattos</p>
        <p>Todos os direitos reservados</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const titulo = urlParams.get('titulo');

            if (titulo) {
                const link = document.getElementById('btn-whatsapp');
                const display = document.getElementById('titulo-vaga-display');
                const mensagem = `Olá, tenho interesse na vaga de ${titulo} e gostaria de me candidatar`;
                
                link.href = `https://wa.me/553173312643?text=${encodeURIComponent(mensagem)}`;
                display.innerText = `Candidatura: ${titulo}`;
            }
        });
    </script>
</body>

</html>
